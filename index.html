<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinite Gradient Flow</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>
<div id="gradient-container">
    <div class="gradient-circle circle-1"></div>
    <div class="gradient-circle circle-2"></div>
    <div class="gradient-circle circle-3"></div>
    <div class="gradient-circle circle-4"></div>
    <div class="gradient-circle mouse-follower"></div>
</div>

<div class="content">
    <h1>Infinite Gradient Flow</h1>
    <p>Move your cursor to interact with the flowing gradients</p>
    <div class="controls">
        <button id="toggle-animation">Pause Animation</button>
        <button id="change-theme">Change Theme</button>
        <div class="slider-container">
            <label for="blur-slider">Blur Intensity:</label>
            <input type="range" id="blur-slider" min="30" max="150" value="80">
        </div>
    </div>
</div>

<div class="particles"></div>

<footer>
    <p>Press spacebar to toggle fullscreen | Click anywhere to create ripples</p>
</footer>

<script src="script.js"></script>
</body>
</html>
